<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogniFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#FFFFFF',
              'primary-dark': '#0A0A0A',
              'primary-light': 'rgba(255, 255, 255, 0.1)',
              background: '#0A0A0A',
              surface: '#1A1A1A',
              'surface-hover': '#252525',
              border: '#2A2A2A',
              'border-hover': '#3A3A3A',
              text: {
                primary: '#FFFFFF',
                secondary: '#A3A3A3',
                muted: '#666666'
              }
            },
            backgroundImage: {
              'gradient-video': 'linear-gradient(135deg, #DC2626 0%, #B91C1C 100%)',
              'gradient-text': 'linear-gradient(135deg, #2563EB 0%, #1E40AF 100%)',
              'gradient-art': 'linear-gradient(135deg, #9333EA 0%, #7E22CE 100%)',
              'gradient-audio': 'linear-gradient(135deg, #059669 0%, #047857 100%)',
              'gradient-business': 'linear-gradient(135deg, #EA580C 0%, #C2410C 100%)',
              'gradient-data': 'linear-gradient(135deg, #0891B2 0%, #0E7490 100%)',
              'gradient-code': 'linear-gradient(135deg, #CA8A04 0%, #A16207 100%)',
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0A0A0A;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .glass {
        background: rgba(10, 10, 10, 0.8);
        backdrop-filter: blur(12px);
      }
    </style>
